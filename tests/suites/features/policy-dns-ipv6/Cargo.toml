[package]
name = "policy-dns-ipv6"
description = "Features suite: policy DNS answers AAAA queries with a synthetic address pinned to the policy endpoint"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ai-openshell/openshell"
publish = false

[[test]]
name = "policy-dns-ipv6"
path = "tests/policy_dns_ipv6.rs"
harness = false

[dependencies]
host-server-support = { path = "../../../support/host-server" }
sandbox-clients-support = { path = "../../../support/sandbox-clients" }
openshell-testkit = { path = "../../../testkit/testkit" }
