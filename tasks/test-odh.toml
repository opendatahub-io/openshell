# opendatahub-io fork: downstream-only ODH/RHOAI e2e tasks.
# Fork-only file — see e2e/rust/tests/odh/README.md.
#
# Normal runs require oc authenticated to an OpenShift cluster with ODH/RHOAI
# installed, IMAGE_TAG for the Quay images, and ALLOWED_IMAGE_REGISTRY_PREFIXES
# for the image provenance test. The shared entrypoint deploys and tears down
# each declared mode; see e2e/rust/tests/odh/README.md for no-deploy limits.

["e2e:odh"]
description = "Run ODH scenarios and managed-workspace tests in their gateway modes"
run = "if [ -z \"${OPENSHELL_BIN:-}\" ]; then cargo build -p openshell-cli || exit $?; export OPENSHELL_BIN=target/debug/openshell; fi; odh/scripts/e2e-odh-entrypoint.sh odh"

["e2e:odh:full"]
description = "Run all feature-enabled e2e binaries across shared and managed gateway modes"
run = "if [ -z \"${OPENSHELL_BIN:-}\" ]; then cargo build -p openshell-cli || exit $?; export OPENSHELL_BIN=target/debug/openshell; fi; odh/scripts/e2e-odh-entrypoint.sh full"

["e2e:odh:smoke"]
description = "Run Smoke tier: upstream + ODH (5 min target)"
run = "if [ -z \"${OPENSHELL_BIN:-}\" ]; then cargo build -p openshell-cli || exit $?; export OPENSHELL_BIN=target/debug/openshell; fi; odh/scripts/e2e-odh-entrypoint.sh smoke"

["e2e:odh:tier1"]
description = "Run Tier 1: upstream + ODH, high-priority (15 min target)"
run = "if [ -z \"${OPENSHELL_BIN:-}\" ]; then cargo build -p openshell-cli || exit $?; export OPENSHELL_BIN=target/debug/openshell; fi; odh/scripts/e2e-odh-entrypoint.sh tier1"

["e2e:odh:tier2"]
description = "Run Tier 2: upstream + ODH, medium/low priority positive tests"
run = "if [ -z \"${OPENSHELL_BIN:-}\" ]; then cargo build -p openshell-cli || exit $?; export OPENSHELL_BIN=target/debug/openshell; fi; odh/scripts/e2e-odh-entrypoint.sh tier2"

["e2e:odh:tier3"]
description = "Run Tier 3: upstream + ODH, negative and destructive tests"
run = "if [ -z \"${OPENSHELL_BIN:-}\" ]; then cargo build -p openshell-cli || exit $?; export OPENSHELL_BIN=target/debug/openshell; fi; odh/scripts/e2e-odh-entrypoint.sh tier3"
