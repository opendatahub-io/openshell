[test-groups]
"@tool:odh:gateway-lifecycle" = { max-threads = 1 }

[profile.e2e-odh]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

# Relative to the profile store dir (`e2e/rust/target/nextest/e2e-odh/`).
[profile.e2e-odh.junit]
path = "../../../../../results/e2e-odh.xml"

# serial_test's in-process locks do not span nextest's test processes.
# Match names so this config also works without these test binaries.
# Two managed workspaces plus host SELinux inspection can exceed five minutes
# on a cold cluster. Keep qualification bounded without truncating cleanup.
[[profile.e2e-odh.overrides]]
filter = "test(~tier2::managed_identity::)"
test-group = "@tool:odh:gateway-lifecycle"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.e2e-odh.overrides]]
filter = """
test(=on_failure_policy_replaces_runtime_and_preserves_workspace)
| test(~tier1::selinux::)
"""
test-group = "@tool:odh:gateway-lifecycle"
