# Build and runtime RPM closure for Dockerfile.konflux.e2e-odh.
# Regenerate with:
#   rpm-lockfile-prototype --outfile deploy/konflux/e2e-odh/rpms.lock.yaml \
#       deploy/konflux/e2e-odh/rpms.in.yaml
contentOrigin:
  repos:
    - repoid: ubi-10-baseos-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/baseos/os/
    - repoid: ubi-10-appstream-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/appstream/os/
packages:
  # The build stage adds only python3.12 for the locked E2E test
  # environment; the rust-builder image already ships rust, cargo, gcc,
  # gcc-c++, make, cmake, openssl-devel, git and tar. This lockfile serves
  # both stages.
  # Runtime stage. The post-quantum ML-KEM hybrid groups come from RHEL 10's
  # stock DEFAULT crypto policy, so no crypto-policies-scripts.
  - git-core
  - tar
  - ca-certificates
  - python3.12
  - libxslt
  - util-linux
  - openssh-clients
  - openssl
arches:
  - x86_64
  - aarch64
installWeakDeps: false
context:
  bare: true
