# Generic fetcher artifacts for Dockerfile.konflux.gateway
# These are prefetched by Hermeto and mounted at /cachi2/deps/generic/
# Include in prefetch-input alongside cargo and rpm types.
#
# To update hashes: curl -sL <url> | sha256sum
metadata:
  version: "1.0"
artifacts:
  # Rust toolchain x86_64 (UBI9 ships rust 1.92.0; workspace MSRV is newer)
  - download_url: https://static.rust-lang.org/dist/rust-1.95.0-x86_64-unknown-linux-gnu.tar.xz
    checksum: "sha256:2e0338f18ecbaa4a0f631b9e80e8b8e26bb6fe77dd5454fba8a70cf96c1e84a1"
    filename: rust-1.95.0-x86_64-unknown-linux-gnu.tar.xz

  # Rust toolchain aarch64
  - download_url: https://static.rust-lang.org/dist/rust-1.95.0-aarch64-unknown-linux-gnu.tar.xz
    checksum: "sha256:094c9c36531911c5cc7dd6ab2d3069ab8dcd744d6239b0bda1387b243dfc391e"
    filename: rust-1.95.0-aarch64-unknown-linux-gnu.tar.xz

  # cargo-auditable (mise.toml 0.7.5). Keep filename version in lockstep with
  # ARG CARGO_AUDITABLE_VERSION in Dockerfile.konflux.gateway.
  - download_url: https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.5/cargo-auditable-x86_64-unknown-linux-gnu.tar.xz
    checksum: "sha256:322eda09f24e5dba97371c6c2c6949569c411ddf893852e88135cc5b51d5a719"
    filename: cargo-auditable-0.7.5-x86_64-unknown-linux-gnu.tar.xz

  - download_url: https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.5/cargo-auditable-aarch64-unknown-linux-gnu.tar.xz
    checksum: "sha256:6d364879b516fa914f98504e551faddedf35b71543b4331a6d26e4e217778cfa"
    filename: cargo-auditable-0.7.5-aarch64-unknown-linux-gnu.tar.xz

  # Z3 source (z3-sys bundled build downloads from GitHub at build time)
  - download_url: https://github.com/Z3Prover/z3/archive/refs/tags/z3-4.16.0.tar.gz
    checksum: "sha256:c68c3e5e4810b16126b8cb4c47eee85c1ac3e24a81914c8e371b40de9dd33ac7"
    filename: z3-4.16.0.tar.gz
