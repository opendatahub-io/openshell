[profile.ci]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Print slow test names after 30 seconds and terminate them after two minutes.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.e2e-kubernetes]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Flag slow tests after 60s and terminate them after five minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# The HA tests scale and roll the shared gateway Deployment, so they cannot
# overlap. Nextest runs each test in its own process. The filter matches test
# names because binary() fails in workspaces without the HA test binary.
[test-groups]
kubernetes-ha = { max-threads = 1 }
odh-gateway-lifecycle = { max-threads = 1 }

[[profile.e2e-kubernetes.overrides]]
filter = "test(/gateway_(scale_and_rollout|pod_rolls)$/)"
test-group = "kubernetes-ha"

# Relative to the profile store dir (`e2e/rust/target/nextest/e2e-kubernetes/`).
[profile.e2e-kubernetes.junit]
path = "../../../../../results/e2e-kubernetes.xml"

[profile.e2e-odh]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

# Relative to the profile store dir (`e2e/rust/target/nextest/e2e-odh/`).
[profile.e2e-odh.junit]
path = "../../../../../results/e2e-odh.xml"

# serial_test's in-process locks do not span nextest's test processes.
# Match names so this config also works without these test binaries.
[[profile.e2e-odh.overrides]]
filter = """
test(=sandbox_exec_large_output_is_complete)
| test(=piped_exec_stdin_crosses_grpc_message_limit)
| test(=sandbox_stop_start_preserves_workspace)
| test(=sandbox_can_be_deleted_while_stopped)
| test(=canonical_main_exit_zero_completes_persistent_sandbox)
| test(=canonical_main_nonzero_exit_preserves_status)
| test(=detached_canonical_main_exit_zero_reaches_completed)
| test(=detached_canonical_main_nonzero_exit_reaches_error)
| test(=canonical_main_and_exec_receive_declared_environment)
| test(=detached_main_exit_during_provisioning_is_classified_as_workload_result)
| test(=canonical_tty_main_uses_sandbox_environment)
| test(=canonical_main_disconnect_reconnect_replays_history_for_same_process)
| test(=canonical_main_connect_recovers_its_ssh_transport)
| test(=canonical_main_connect_forwards_pid_targeted_termination_and_reaps_ssh)
| test(=canonical_main_exit_255_is_not_retried_as_transport_failure)
| test(=on_failure_policy_replaces_runtime_and_preserves_workspace)
| test(=sandbox_create_with_no_keep_preserves_failure_then_cleans_up)
| test(~tier1::selinux::)
"""
test-group = "odh-gateway-lifecycle"
