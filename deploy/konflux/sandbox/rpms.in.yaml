# RPM dependencies for Dockerfile.konflux.sandbox
# Build stage only: the ubi-micro runtime stage installs no RPMs.
#
# Resolved with `context.bare: true` so the lockfile pins the full dependency
# closure; bare guarantees every package is pinned and prefetched regardless
# of what the ubi:10.2 build base already provides.
#
# Target arches and repos are declared in this file (not passed on the command
# line) so Konflux MintMaker can regenerate the lockfile with no CLI flags.
# Regenerate manually with:
#   rpm-lockfile-prototype --outfile deploy/konflux/sandbox/rpms.lock.yaml \
#       deploy/konflux/sandbox/rpms.in.yaml
#
# UBI content is public, so repos are inlined here rather than copied from the
# image; rpm-lockfile-prototype resolves versions from the CDN and cannot read
# /etc/yum.repos.d from inside the base image.
contentOrigin:
  repos:
    - repoid: ubi-10-baseos-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/baseos/os/
    - repoid: ubi-10-appstream-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/appstream/os/
    # glibc-static (for `-C target-feature=+crt-static`) ships in CodeReady
    # Builder, whose content is public on the UBI CDN.
    - repoid: ubi-10-codeready-builder-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/codeready-builder/os/
packages:
  # Build stage: static glibc + build tools
  - gcc
  - make
  - tar
  - xz
  - glibc-static
  # Build stage: Rust compilation (generic-fetcher.yaml provides rust/cargo)
  - gcc-c++
  - cmake
  - openssl-devel
  - git-core
arches:
  - x86_64
  - aarch64
# Exclude weak dependencies (Recommends/Supplements) so the closure is minimal
# and deterministic regardless of the regenerating host's DNF default. Must stay
# in sync with the `--setopt=install_weak_deps=0` flags in the Dockerfile.
installWeakDeps: false
context:
  bare: true
