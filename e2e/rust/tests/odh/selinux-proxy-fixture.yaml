---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-odh-selinux-proxy
data:
  fixture.py: |
    import http.server, os, select, socket, ssl, subprocess, tempfile, threading, time
    allowed_host, allowed_port = "openshell-odh-selinux-proxy.openshell.svc", 8443
    marker = b"odh-selinux-proxy-upstream"

    # This fixture carries no credential, so the destination allowlist is the
    # only thing standing between it and an open relay. The single permitted
    # destination is the fixture's own TLS listener, which makes a misdirected
    # CONNECT a loop back here rather than a reachable third party.
    #
    # The network supervisor sends the validated resolved address, not the
    # hostname, so the allowlist has to resolve the fixture Service itself.
    # Accept the hostname too for the proxy_connect_by_hostname opt-in.
    def allowed(host, port):
        if port != allowed_port: return False
        if host == allowed_host: return True
        try:
            infos = socket.getaddrinfo(allowed_host, allowed_port, proto=socket.IPPROTO_TCP)
        except OSError:
            return False
        return host in {info[4][0] for info in infos}

    # Each connection gets a thread, and any workload that reaches the Service
    # can open one, so a client that never completes a header must not park it.
    # Bound the read by total time and size, then hand an unbounded socket to
    # the tunnel.
    def header(connection):
        deadline = time.monotonic() + 10
        connection.settimeout(10)
        data = b""
        while b"\r\n\r\n" not in data:
            if len(data) > 16384 or time.monotonic() > deadline: return None
            try:
                part = connection.recv(4096)
            except TimeoutError:
                return None
            if not part: return None
            data += part
        connection.settimeout(None)
        return data

    def copy(left, right):
        try:
            while True:
                ready, _, _ = select.select([left, right], [], [])
                for source in ready:
                    data = source.recv(65536)
                    if not data: return
                    (right if source is left else left).sendall(data)
        except OSError: pass

    def proxy(connection):
        try:
            raw = header(connection)
            if raw is None: return
            parts = raw.decode("latin-1").split("\r\n")[0].split()
            target = parts[1] if len(parts) > 1 else "invalid"
            if len(parts) < 2 or parts[0] != "CONNECT":
                print(f"CONNECT {target} method=denied", flush=True)
                connection.sendall(b"HTTP/1.1 405 Method Not Allowed\r\nContent-Length: 0\r\n\r\n")
                return
            host, _, port = target.rpartition(":")
            host = host.strip("[]")
            if not port.isdigit() or not allowed(host, int(port)):
                print(f"CONNECT {target} target=denied", flush=True)
                connection.sendall(b"HTTP/1.1 403 Forbidden\r\nContent-Length: 0\r\n\r\n")
                return
            try:
                upstream = socket.create_connection((host, int(port)), timeout=10)
            except OSError:
                print(f"CONNECT {target} dial=fail", flush=True)
                connection.sendall(b"HTTP/1.1 502 Bad Gateway\r\nContent-Length: 0\r\n\r\n")
                return
            print(f"CONNECT {target} allowed", flush=True)
            connection.sendall(b"HTTP/1.1 200 Connection Established\r\n\r\n")
            copy(connection, upstream)
            upstream.close()
        except OSError: pass
        finally: connection.close()

    class Upstream(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Length", str(len(marker)))
            self.end_headers()
            self.wfile.write(marker)
        def log_message(self, *_): pass

    directory = tempfile.mkdtemp()
    key, cert = os.path.join(directory, "key"), os.path.join(directory, "cert")
    subprocess.run(["openssl", "req", "-x509", "-newkey", "rsa:2048", "-nodes", "-keyout", key, "-out", cert, "-days", "1", "-subj", "/CN=fixture"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
    upstream = http.server.HTTPServer(("0.0.0.0", 8443), Upstream)
    tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    tls.load_cert_chain(cert, key)
    upstream.socket = tls.wrap_socket(upstream.socket, server_side=True)
    threading.Thread(target=upstream.serve_forever, daemon=True).start()
    listener = socket.socket()
    listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    listener.bind(("0.0.0.0", 8000))
    listener.listen(32)
    print("fixture-ready", flush=True)
    while True:
        connection, _ = listener.accept()
        threading.Thread(target=proxy, args=(connection,), daemon=True).start()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-odh-selinux-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshell-odh-selinux-proxy
  template:
    metadata:
      labels:
        app: openshell-odh-selinux-proxy
    spec:
      containers:
        - name: fixture
          image: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/fixture/fixture.py"]
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: openshell-odh-selinux-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: openshell-odh-selinux-proxy
spec:
  selector:
    app: openshell-odh-selinux-proxy
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: upstream
      port: 8443
      targetPort: 8443
