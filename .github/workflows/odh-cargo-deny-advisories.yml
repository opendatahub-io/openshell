# Midstream RustSec advisory scan. Catch crate CVEs in Cargo.lock early,
# before a build is released on a GA branch. Kept separate from
# cargo-deny.yml so ODH does not depend on NVIDIA self-hosted runners or
# the NVIDIA CI image.

name: ODH Cargo Deny Advisories

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Dublin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odh-cargo-deny-advisories-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  advisories:
    name: Cargo Deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stable mise-action (v4.2.0). install: false skips the full mise.toml
      # toolset so we only install rust + cargo-deny next. experimental: true
      # matches mise.toml so the github: backend can install cargo-deny; note, it is
      # not an unstable action channel.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          experimental: true

      # Pin rust + cargo-deny from mise.lock. rust is required for cargo metadata.
      - name: Install cargo-deny
        run: mise install --locked rust github:EmbarkStudios/cargo-deny

      # mise shims re-apply mise.toml RUSTC_WRAPPER=sccache. env -u before
      # `cargo` is not enough. Call the real binaries and drop the wrapper
      # so cargo metadata does not need sccache (this job does not install it).
      - name: Check dependency advisories
        run: |
          set -euo pipefail
          cargo_bin="$(mise which cargo)"
          deny_bin="$(mise which cargo-deny)"
          env -u RUSTC_WRAPPER -u CARGO_BUILD_RUSTC_WRAPPER \
            CARGO="$cargo_bin" \
            PATH="$(dirname "$cargo_bin"):$(dirname "$deny_bin"):$PATH" \
            "$deny_bin" check advisories
  notify-slack:
    name: Notify Slack on failure
    needs: advisories
    if: >-
      ${{ always() &&
          needs.advisories.result == 'failure' &&
          github.repository == 'red-hat-data-services/openshell' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post failure notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set; skipping Slack notification."
            exit 0
          fi

          message="$(printf '%s\n%s' \
            ':x: ODH Cargo Deny Advisories' \
            "Run: $WORKFLOW_RUN_URL")"

          jq -nc \
            --arg text "$message" \
            '{text: $text}' |
            curl --fail --silent --show-error \
              -X POST \
              -H 'Content-Type: application/json' \
              --data @- \
              "$SLACK_WEBHOOK_URL"
